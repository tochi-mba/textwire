[project]
name = "textwire"
version = "0.1.0"
description = "A text-mode web delivered over SMS: the server that fetches, compresses and sends."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "REX Technologies" }]
keywords = ["sms", "twilio", "zstd", "reader-mode", "offline"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "ddgs>=9.16",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "trafilatura>=2.2",
    "uvicorn[standard]>=0.30",
    "zstandard==0.25.0",
]

[project.scripts]
textwire = "textwire.cli.main:main"

[project.urls]
Repository = "https://github.com/tochi-mba/textwire"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
]
dev = [
    {include-group = "docs"},
    "asgi-lifespan>=2.1",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textwire"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Build output, including the staged documentation site.
extend-exclude = ["../build"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "D", "DTZ", "E", "EM", "ERA", "F", "FA",
    "I", "ICN", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
# ANN401: Any is allowed where a value is genuinely untyped JSON.
# TRY003: short messages at the raise site read better than an exception per message.
# D105, D107: dunder methods and __init__ are documented on the class.
ignore = ["ANN401", "TRY003", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# One HTML document in a string: CSS and JavaScript lines are as long as they need to be.
"src/textwire/api/dashboard.py" = ["E501"]
"tests/**" = [
    "ARG001", "ARG002", "D", "EM", "S101", "S105", "S106", "S107", "SLF001",
    "PLR2004", "TC001", "TC002", "TC003", "PLC0415",
]
"scripts/**" = ["T201", "D"]
"src/textwire/cli/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["textwire", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 8

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true
# faulthandler is off: on Windows with Python 3.12 it prints a "Windows fatal exception" dump
# for a WMI error that platform.system() raises and handles itself, which reads like a crash.
addopts = "-ra --strict-markers --strict-config -m 'not live' -p no:faulthandler"
markers = [
    "live: talks to a real Twilio account and sends real SMS; never runs in CI",
]

[tool.coverage.run]
branch = true
source = ["textwire"]
omit = ["*/textwire/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# Only lines that cannot execute. There is deliberately no "pragma: no cover".
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "@overload",
]

[tool.importlinter]
root_package = "textwire"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: the command line on top, the wire format at the bottom"
type = "layers"
layers = [
    "textwire.cli",
    "textwire.api",
    "textwire.service",
    "textwire.content",
    "textwire.protocol",
]

[[tool.importlinter.contracts]]
name = "Configuration, logging and the clock are leaves"
type = "forbidden"
source_modules = ["textwire.config", "textwire.logs", "textwire.clock"]
forbidden_modules = ["textwire.cli", "textwire.vectors", "textwire.content", "textwire.service"]

[[tool.importlinter.contracts]]
name = "The wire format is pure: no I/O, no web, no settings"
type = "forbidden"
source_modules = ["textwire.protocol"]
forbidden_modules = ["httpx", "trafilatura", "ddgs", "pydantic", "pydantic_settings", "textwire.config"]

[[tool.importlinter.contracts]]
name = "One module each talks to the extractor, the search engine and the web"
type = "forbidden"
source_modules = [
    "textwire.cli",
    "textwire.vectors",
    "textwire.content.markdown",
    "textwire.content.pages",
    "textwire.content.render",
]
forbidden_modules = ["trafilatura", "ddgs", "httpx"]
allow_indirect_imports = true
