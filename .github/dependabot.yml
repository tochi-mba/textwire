version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # zstandard is pinned exactly: its output is in the golden vectors, so an upgrade is a
    # protocol change made by hand (see docs/adr/0004-zstd-with-a-trained-dictionary.md).
    ignore:
      - dependency-name: zstandard

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    # These releases need compile SDK 37, which the Android SDK repository does not offer yet
    # (see android/gradle/libs.versions.toml). Lift the ignores when SDK 37 ships.
    ignore:
      - dependency-name: androidx.core:core-ktx
        versions: [">=1.19.0"]
      - dependency-name: androidx.compose:compose-bom
        versions: [">=2026.09.00"]
      - dependency-name: androidx.work:*
        versions: [">=2.12.0"]
